{{ define "main" }}
{{- if eq .Section "posts" }}
<p class="pagenav">
  {{ with .PrevInSection }}<span class="navleft">&laquo; <a href="{{ .RelPermalink }}">{{ .Title }}</a></span>{{ end }}
  {{ with .NextInSection }}<span class="navright"><a href="{{ .RelPermalink }}">{{ .Title }}</a> &raquo;</span>{{ end }}
</p>
{{- end }}
{{ partial "post.html" . }}
{{ if eq .Section "posts" }}{{ partial "comments.html" . }}{{ end }}
{{ end }}
